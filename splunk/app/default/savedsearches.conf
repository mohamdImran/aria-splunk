# ARIA Saved Searches — alert rules that autonomously trigger the ARIA pipeline.
#
# How these work in production:
#   1. Splunk evaluates these searches every N minutes
#   2. When conditions are met, the alert fires
#   3. The "aria_trigger" alert action (bin/aria_trigger.py) runs
#   4. aria_trigger.py POSTs to ARIA's /api/incidents endpoint
#   5. ARIA's 4-agent pipeline starts automatically — no human needed
#
# This is fully autonomous incident response: Splunk detects → ARIA investigates.

[ARIA - High Error Rate]
search = index=main error_rate > 5 \
  | stats avg(error_rate) as avg_err by service \
  | where avg_err > 5
cron_schedule = */5 * * * *
enableSched = 1
alert.track = 1
alert.severity = 4
alert.suppress = 0
action.aria_trigger = 1
action.aria_trigger.param.severity = P2
description = Fires ARIA pipeline when any service error rate exceeds 5%

[ARIA - DB Connection Pool Critical]
search = index=main sourcetype=db_metrics \
  | eval pool_pct = (connection_pool_used / connection_pool_max) * 100 \
  | stats avg(pool_pct) as avg_pool by host \
  | where avg_pool > 85
cron_schedule = */2 * * * *
enableSched = 1
alert.track = 1
alert.severity = 5
alert.suppress = 0
action.aria_trigger = 1
action.aria_trigger.param.severity = P1
description = Fires ARIA pipeline when DB connection pool exceeds 85%

[ARIA - Response Time Spike]
search = index=main \
  | timechart span=5m avg(response_time) as rt by service \
  | where rt > 500
cron_schedule = */5 * * * *
enableSched = 1
alert.track = 1
alert.severity = 3
action.aria_trigger = 1
action.aria_trigger.param.severity = P2
description = Fires ARIA pipeline when API response time exceeds 500ms

[ARIA - Anomaly Baseline (hourly calibration)]
search = index=main earliest=-7d latest=now \
  | timechart span=1h avg(response_time) as baseline_rt, avg(error_rate) as baseline_err by service
cron_schedule = 0 * * * *
enableSched = 1
alert.track = 0
description = Hourly baseline computation for anomaly detection (no alert action)
