# ARIA Alert Action — triggers the ARIA agentic pipeline
# This is the "AI for Splunk Apps" integration:
# When any Splunk alert fires, this action calls ARIA's REST API
# which starts the multi-agent LangGraph pipeline.
#
# This is how ARIA runs autonomously in production:
# Splunk detects anomaly → fires alert → this action calls ARIA →
# ARIA agents investigate, build causal graph, predict blast radius,
# generate and execute remediation runbook.

[aria_trigger]
label = Trigger ARIA Incident Pipeline
description = Automatically start ARIA causal AI investigation for this alert
icon_path = aria_icon.png
payload_format = json
is_custom = 1
