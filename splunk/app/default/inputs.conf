# ARIA Splunk App — Data Inputs
#
# These inputs collect ARIA's own operational events back into Splunk
# so you can monitor the AI pipeline itself. Meta-observability.

# Monitor ARIA agent event logs (Linux/Mac path — adjust for Windows)
# Windows path would be: C:\aria\logs\
[monitor://C:\Users\Mohamad-Nofal\Documents\splunck-project\aria\backend\logs]
disabled = true
index = aria_events
sourcetype = aria_agent_events
followTail = 0

# HTTP Event Collector — ARIA backend can push events directly
# Enable HEC in Splunk: Settings → Data Inputs → HTTP Event Collector
[http://aria_pipeline_events]
disabled = true
index = aria_events
sourcetype = aria_pipeline
token = (set after enabling HEC in Splunk Web)
